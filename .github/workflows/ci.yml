name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - name: dotnet test
        run: >-
          dotnet test tests/Todo.UnitTests/Todo.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-test-results
          path: TestResults/*.trx
          retention-days: 14
          if-no-files-found: error

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TODO_DB: 'Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=todos'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - name: dotnet test
        run: >-
          dotnet test tests/Todo.IntegrationTests/Todo.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Publish integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-integration-test-results
          path: TestResults/*.trx
          retention-days: 14
          if-no-files-found: error
